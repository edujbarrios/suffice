name: llm7-agent-efficiency-baseline
tasks: ../benchmarks/llm7_context_efficiency_v1.jsonl
seed: 42
system_prompt: Return only the requested answer, with no explanation or formatting.
model:
  provider: openai_compatible
  base_url: https://api.llm7.io/v1
  api_key_env: LLM7_API_KEY
  model: default
  temperature: 0
  max_tokens: 128
  timeout_seconds: 60
  retries: 2
optimization:
  minimum_success_rate: 0.95
  maximum_success_drop: 0.01
output_directory: ../runs
