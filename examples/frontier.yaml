name: offline-budget-frontier
tasks: ../benchmarks/agent_efficiency.jsonl
seed: 42
system_prompt: Answer correctly and concisely. Use only relevant context and tools.
model:
  provider: mock
  model: deterministic
  temperature: 0
  max_tokens: 256
token_budgets: [16, 32, 64, 128, 256]
optimization:
  minimum_success_rate: 0.95
  maximum_success_drop: 0.01
history_tail: 4
retrieval_top_k: 3
tool_description_mode: full
tool_output_mode: full
output_directory: ../runs

