[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "suffice"
version = "0.1.0"
description = "Token-efficiency evaluation for AI agents"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
authors = [{name = "Eduardo J. Barrios"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["httpx>=0.27"]
dev = ["build>=1.2", "httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
suffice = "suffice.cli:main"

[project.urls]
Repository = "https://github.com/edujbarrios/suffice"
Issues = "https://github.com/edujbarrios/suffice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/suffice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

